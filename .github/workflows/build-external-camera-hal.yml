name: Build External Camera HAL (HIDL 2.7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openjdk-17-jdk repo ninja-build \
            libssl-dev libncurses-dev bc bison flex libelf-dev \
            build-essential zip unzip curl wget
          # repo tool
          mkdir -p ~/.local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download AOSP system image with external camera HAL
        run: |
          # Download Android 14 x86_64 system image which contains prebuilt camera HAL
          wget -q "https://dl.google.com/android/repository/sys-img/android/x86_64-34_r01.zip" -O sysimg.zip
          unzip -q sysimg.zip
          ls -la

      - name: Extract HAL from system image
        run: |
          # Install tools for sparse image
          sudo apt-get install -y android-sdk-libsparse-utils erofs-utils || true

          # Convert sparse to raw if needed
          SYSIMG=$(find . -name "system.img" | head -1)
          echo "Found: $SYSIMG"
          file "$SYSIMG"

          # Try simg2img first (sparse format)
          if command -v simg2img &>/dev/null; then
            simg2img "$SYSIMG" system_raw.img 2>/dev/null || cp "$SYSIMG" system_raw.img
          else
            cp "$SYSIMG" system_raw.img
          fi

          sudo mkdir -p /mnt/sysimg
          # Try ext4 mount
          sudo mount -o loop,ro system_raw.img /mnt/sysimg 2>/dev/null || \
          # Try erofs mount  
          sudo mount -t erofs -o loop,ro system_raw.img /mnt/sysimg 2>/dev/null || \
          # Try with fstype auto
          sudo mount -o loop,ro,fstype=auto system_raw.img /mnt/sysimg 2>/dev/null || \
          { echo "All mount attempts failed"; file system_raw.img; exit 1; }

          echo "Mount successful, listing contents:"
          ls /mnt/sysimg/

          # Find external camera HAL
          find /mnt/sysimg -name "*external*camera*" 2>/dev/null
          find /mnt/sysimg -name "*camera*provider*V1*" 2>/dev/null

          # Copy files
          mkdir -p module_tmp/system/vendor/bin/hw
          mkdir -p module_tmp/system/vendor/etc/init
          mkdir -p module_tmp/system/vendor/etc
          mkdir -p module_tmp/META-INF/com/google/android

          HAL=$(find /mnt/sysimg -name "*camera*provider*external*" -o -name "*external*camera*service*" 2>/dev/null | head -1)
          if [ -n "$HAL" ]; then
            cp "$HAL" module_tmp/system/vendor/bin/hw/
            echo "Copied: $HAL"
          else
            echo "HAL not found, listing camera files:"
            find /mnt/sysimg -name "*camera*" 2>/dev/null | head -30
            exit 1
          fi

      - name: Create module files
        run: |
          mkdir -p module_tmp/system/vendor/etc/init
          mkdir -p module_tmp/META-INF/com/google/android

          printf '<ExternalCamera>\n    <Provider>\n        <ignore><id>0</id><id>1</id><id>2</id><id>3</id></ignore>\n    </Provider>\n    <Device>\n        <MaxJpegBufferSize bytes="33554432"/>\n        <NumVideoBuffers count="4"/>\n        <NumStillBuffers count="2"/>\n    </Device>\n</ExternalCamera>\n' > module_tmp/system/vendor/etc/external_camera_config.xml

          printf 'service vendor.camera.ext /vendor/bin/hw/android.hardware.camera.provider-V1-external-service\n    class hal\n    user cameraserver\n    group audio camera input drmrpc\n    ioprio rt 4\n    capabilities SYS_NICE\n    onrestart restart cameraserver\n' > module_tmp/system/vendor/etc/init/android.hardware.camera.provider-V1-external.rc

          printf 'id=external-camera-hal\nname=External Camera HAL V1\nversion=v1\nversionCode=1\nauthor=dawoodjanwahedi\ndescription=External Camera HAL for v4l2loopback\n' > module_tmp/module.prop

          printf '#MAGISK\n' > module_tmp/META-INF/com/google/android/updater-script

          printf '#!/sbin/sh\nSKIPUNZIP=1\nunzip -o "$ZIPFILE" '"'"'system/*'"'"' -d "$MODPATH"\nset_perm_recursive "$MODPATH/system/vendor/bin/hw" root shell 0755 0755\n' > module_tmp/META-INF/com/google/android/update-binary
          chmod 0755 module_tmp/META-INF/com/google/android/update-binary

      - name: Package Magisk module
        run: |
          cd module_tmp
          zip -r ../external-camera-hal-magisk.zip .
          cd ..
          ls -lh external-camera-hal-magisk.zip

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-camera-hal-magisk
          path: external-camera-hal-magisk.zip
