name: Build External Camera HAL (HIDL 2.7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openjdk-17-jdk repo ninja-build \
            libssl-dev libncurses-dev bc bison flex libelf-dev \
            build-essential zip unzip curl wget
          # repo tool
          mkdir -p ~/.local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install AOSP build dependencies
        run: |
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python3-pip openjdk-17-jdk repo \
            libssl-dev bc rsync ccache

      - name: Configure git
        run: |
          git config --global user.email "ci@build.com"
          git config --global user.name "CI Build"
          git config --global color.ui false

      - name: Repo init AOSP android-14.0.0_r67
        run: |
          mkdir -p ~/aosp && cd ~/aosp
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android-13.0.0_r82 \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:limit=10M

      - name: Repo sync
        run: |
          cd ~/aosp
          repo sync -j8 --no-tags --no-clone-bundle \
            hardware/interfaces \
            hardware/libhardware \
            frameworks/av \
            frameworks/native \
            system/core \
            system/tools/aidl \
            system/tools/hidl \
            system/libhidl \
            system/logging \
            system/libbase \
            system/libfmq \
            prebuilts/clang/host/linux-x86 \
            prebuilts/build-tools \
            prebuilts/go/linux-x86 \
            prebuilts/bazel/common \
            build/soong \
            build/make \
            build/blueprint \
            external/libcxx \
            external/libcxxabi \
            external/googletest \
            external/boringssl \
            external/golang-protobuf \
            external/protobuf \
            external/lz4 \
            external/zlib \
            external/zstd \
            external/expat \
            external/starlark-go \
            libnativehelper

      - name: Build external camera HAL
        run: |
          cd ~/aosp
          source build/envsetup.sh
          lunch aosp_arm64-userdebug
          m android.hardware.camera.provider@2.7-external-service -j8

      - name: Collect and package
        run: |
          cd ~/aosp
          SERVICE=$(find out -name "android.hardware.camera.provider@2.7-external-service" -type f | head -1)
          IMPL=$(find out -name "android.hardware.camera.provider@2.7-impl.so" -type f | head -1)

          if [ -z "$SERVICE" ]; then
            echo "ERROR: binary not found"
            find out -name "*camera*external*" 2>/dev/null
            exit 1
          fi

          mkdir -p ~/module_tmp/system/vendor/bin/hw
          mkdir -p ~/module_tmp/system/vendor/lib64/hw
          mkdir -p ~/module_tmp/system/vendor/etc/init
          mkdir -p ~/module_tmp/META-INF/com/google/android

          cp "$SERVICE" ~/module_tmp/system/vendor/bin/hw/
          [ -n "$IMPL" ] && cp "$IMPL" ~/module_tmp/system/vendor/lib64/hw/

          python3 -c "
            import os
            base = os.path.expanduser('~/module_tmp')
            open(f'{base}/system/vendor/etc/external_camera_config.xml','w').write('''<ExternalCamera>
              <Provider><ignore><id>0</id><id>1</id><id>2</id><id>3</id></ignore></Provider>
              <Device>
                <MaxJpegBufferSize bytes=\"33554432\"/>
                <NumVideoBuffers count=\"4\"/>
                <NumStillBuffers count=\"2\"/>
                <FpsLimits><FpsLimit><size width=\"1280\" height=\"720\"/><fpsUpperBound>30.0</fpsUpperBound></FpsLimit></FpsLimits>
                <MinimumStreamSize width=\"640\" height=\"480\"/>
              </Device>
            </ExternalCamera>
            ''')
            open(f'{base}/system/vendor/etc/init/android.hardware.camera.provider@2.7-external.rc','w').write('''service vendor.camera.provider2_7_ext /vendor/bin/hw/android.hardware.camera.provider@2.7-external-service
              class hal
              user cameraserver
              group audio camera input drmrpc
              ioprio rt 4
              capabilities SYS_NICE
              onrestart restart cameraserver
            ''')
            open(f'{base}/module.prop','w').write('''id=external-camera-hal
            name=External Camera HAL v2.7
            version=v1
            versionCode=1
            author=dawoodjanwahedi
            description=External Camera HAL for v4l2loopback on LineageOS 23.2
            ''')
            open(f'{base}/META-INF/com/google/android/updater-script','w').write('#MAGISK\n')
            open(f'{base}/META-INF/com/google/android/update-binary','w').write('''#!/sbin/sh
            SKIPUNZIP=1
            unzip -o \"\$ZIPFILE\" 'system/*' -d \"\$MODPATH\"
            set_perm_recursive \"\$MODPATH/system/vendor/bin/hw\" root shell 0755 0755
            ''')
            os.chmod(f'{base}/META-INF/com/google/android/update-binary', 0o755)
            print('Module files created')
            "

          cd ~/module_tmp
          zip -r ~/external-camera-hal-magisk.zip .
          echo "Done: $(ls -lh ~/external-camera-hal-magisk.zip)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-camera-hal-magisk
          path: ~/external-camera-hal-magisk.zip
