name: Build External Camera HAL (HIDL 2.7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openjdk-17-jdk repo ninja-build \
            libssl-dev libncurses-dev bc bison flex libelf-dev \
            build-essential zip unzip curl wget
          # repo tool
          mkdir -p ~/.local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download arm64 GSI with external camera HAL
        run: |
          # SourceForge is blocked by Cloudflare in CI
          # Download from GitHub releases instead - use a known LineageOS build
          # that contains external camera HAL binaries

          # Try GitHub releases from known repos that have prebuilt arm64 HAL
          curl -L --retry 3 --max-time 300 \
            "https://github.com/AndyCGYan/lineage_build_unified/releases/download/lineage-20.0-20231115/lineage-20.0-20231115-UNOFFICIAL-arm64_bvN.img.gz" \
            -o lineage20.img.gz || \
          curl -L --retry 3 --max-time 300 \
            "https://github.com/phhusson/treble_experimentations/releases/download/v417/system-roar-arm64_bvN.img.gz" \
            -o lineage20.img.gz

          SIZE=$(stat -c%s lineage20.img.gz 2>/dev/null || echo 0)
          echo "Downloaded size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "Download failed - file too small"
            cat lineage20.img.gz
            exit 1
          fi

          gunzip lineage20.img.gz || true
          # Handle both .gz and direct img
          IMGFILE=$(find . -name "*.img" -not -name "*.img.gz" | head -1)
          echo "Image file: $IMGFILE"
          ls -lh "$IMGFILE" 2>/dev/null || ls -lh .
          file "$IMGFILE" 2>/dev/null || true

      - name: Extract HAL from GSI
        run: |
          sudo apt-get install -y erofs-utils

          # Mount the GSI
          sudo mkdir -p /mnt/gsi
          sudo mount -o loop,ro lineage20.img /mnt/gsi 2>/dev/null || \
          sudo mount -t erofs -o loop,ro lineage20.img /mnt/gsi 2>/dev/null || \
          { echo "Mount failed"; file lineage20.img; exit 1; }

          echo "=== GSI contents ==="
          ls /mnt/gsi/

          echo "=== Looking for external camera HAL ==="
          find /mnt/gsi -name "*external*camera*" 2>/dev/null
          find /mnt/gsi -name "*camera*provider*2.7*" 2>/dev/null
          find /mnt/gsi -name "*camera*provider*" 2>/dev/null | grep -i external | head -10

          # Copy HAL files
          mkdir -p module_tmp/system/vendor/bin/hw
          mkdir -p module_tmp/system/vendor/lib64/hw
          mkdir -p module_tmp/system/vendor/etc/init
          mkdir -p module_tmp/system/vendor/etc
          mkdir -p module_tmp/META-INF/com/google/android

          SERVICE=$(find /mnt/gsi -name "*camera*provider*2.7*external*service*" -o -name "*external*camera*provider*service*" 2>/dev/null | head -1)
          IMPL=$(find /mnt/gsi -name "*camera*provider*2.7*impl*" 2>/dev/null | head -1)

          if [ -n "$SERVICE" ]; then
            cp "$SERVICE" module_tmp/system/vendor/bin/hw/
            echo "Copied service: $SERVICE"
          else
            echo "Service not found"
            find /mnt/gsi -name "*camera*" 2>/dev/null | head -30
            exit 1
          fi

          if [ -n "$IMPL" ]; then
            cp "$IMPL" module_tmp/system/vendor/lib64/hw/
            echo "Copied impl: $IMPL"
          fi

      - name: Create module files
        run: |
          mkdir -p module_tmp/system/vendor/etc/init
          mkdir -p module_tmp/META-INF/com/google/android

          printf '<ExternalCamera>\n    <Provider>\n        <ignore><id>0</id><id>1</id><id>2</id><id>3</id></ignore>\n    </Provider>\n    <Device>\n        <MaxJpegBufferSize bytes="33554432"/>\n        <NumVideoBuffers count="4"/>\n        <NumStillBuffers count="2"/>\n    </Device>\n</ExternalCamera>\n' > module_tmp/system/vendor/etc/external_camera_config.xml

          printf 'service vendor.camera.ext /vendor/bin/hw/android.hardware.camera.provider-V1-external-service\n    class hal\n    user cameraserver\n    group audio camera input drmrpc\n    ioprio rt 4\n    capabilities SYS_NICE\n    onrestart restart cameraserver\n' > module_tmp/system/vendor/etc/init/android.hardware.camera.provider-V1-external.rc

          printf 'id=external-camera-hal\nname=External Camera HAL V1\nversion=v1\nversionCode=1\nauthor=dawoodjanwahedi\ndescription=External Camera HAL for v4l2loopback\n' > module_tmp/module.prop

          printf '#MAGISK\n' > module_tmp/META-INF/com/google/android/updater-script

          printf '#!/sbin/sh\nSKIPUNZIP=1\nunzip -o "$ZIPFILE" '"'"'system/*'"'"' -d "$MODPATH"\nset_perm_recursive "$MODPATH/system/vendor/bin/hw" root shell 0755 0755\n' > module_tmp/META-INF/com/google/android/update-binary
          chmod 0755 module_tmp/META-INF/com/google/android/update-binary

      - name: Package Magisk module
        run: |
          cd module_tmp
          zip -r ../external-camera-hal-magisk.zip .
          cd ..
          ls -lh external-camera-hal-magisk.zip

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-camera-hal-magisk
          path: external-camera-hal-magisk.zip
