name: Build LineageOS Kernel with V4L2 Loopback

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-dev \
            git \
            curl \
            wget \
            libssl-dev \
            bc \
            bison \
            flex \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            unzip
      
      - name: Download Clang r547379
        run: |
          git clone --depth=1 https://gitlab.com/itsshashanksp/android_prebuilts_clang_host_linux-x86_clang-r547379.git $HOME/clang
          CLANG_BIN=$HOME/clang/clang-r547379/bin
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "$CLANG_BIN" >> $GITHUB_PATH
      
      - name: Load kernel configuration
        run: |
          # Merge vendor configs
          cat arch/arm64/configs/vendor/sdmsteppe-perf_defconfig arch/arm64/configs/vendor/sweet.config > .config
      
      - name: Generate kernel config
        run: |
          make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 CC=clang HOSTCC=clang olddefconfig 2>&1 || true
      
      - name: Build kernel with LTO
        run: |
          make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out mrproper 2>/dev/null || true
          rm -rf $GITHUB_WORKSPACE/out
          mkdir -p $GITHUB_WORKSPACE/out
          cat arch/arm64/configs/vendor/sdmsteppe-perf_defconfig arch/arm64/configs/vendor/sweet.config > .config
          make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 CC=clang HOSTCC=clang olddefconfig
          make -C $GITHUB_WORKSPACE O=$GITHUB_WORKSPACE/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=clang \
            CONFIG_LTO=y CONFIG_LTO_CLANG=y -j$(nproc) 2>&1 | tee build.log
      
      - name: Check for v4l2loopback in build
        run: |
          echo "=== Checking V4L2 Loopback build status ==="
          if grep -q "v4l2loopback" build.log; then
            echo "✓ V4L2 Loopback module found in build output"
          else
            echo "⚠ V4L2 Loopback module not clearly identified in build output"
          fi
          
          echo "=== Kernel modules ==="
          ls -la $GITHUB_WORKSPACE/out/ || true
          
          if [ -f "$GITHUB_WORKSPACE/out/v4l2loopback.ko" ]; then
            echo "✓ v4l2loopback.ko successfully built!"
            file $GITHUB_WORKSPACE/out/v4l2loopback.ko
          fi
      
      - name: Create AnyKernel3 package
        run: |
          echo "Creating AnyKernel3 ZIP..."
          
          mkdir -p AnyKernel3/kernel/lg
          mkdir -p AnyKernel3/modules
          
          # Copy kernel image
          if [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image AnyKernel3/kernel/lg/Image
            echo "✓ Kernel image copied"
          else
            echo "✗ Kernel image not found!"
            ls -la $GITHUB_WORKSPACE/out/arch/arm64/boot/ || echo "boot dir not found"
            exit 1
          fi
          
          # Copy device tree blob
          if [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/xiaomi/sm6150-sweet.dtb" ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dts/xiaomi/sm6150-sweet.dtb AnyKernel3/kernel/lg/
            echo "✓ DTB copied"
          elif [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dts/sm6150.dtb" ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dts/sm6150.dtb AnyKernel3/kernel/lg/
            echo "✓ DTB copied (alternate location)"
          fi
          
          # Copy kernel modules
          find $GITHUB_WORKSPACE/out -name "*.ko" -type f 2>/dev/null | while read ko; do
            cp "$ko" AnyKernel3/modules/
            echo "✓ Copied $(basename $ko)"
          done
          
          # Create AnyKernel3 ZIP
          cd AnyKernel3
          zip -r ../lineage-v4l2loopback-kernel.zip . -x "*.git*"
          cd ..
          
          echo "✓ AnyKernel3 ZIP created successfully!"
          ls -lh lineage-v4l2loopback-kernel.zip
      
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-v4l2loopback-kernel-zip
          path: lineage-v4l2loopback-kernel.zip
      
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      
      - name: Create release on successful build
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: lineage-v4l2loopback-kernel.zip
          tag_name: kernel-build-${{ github.run_number }}
          body: |
            **LineageOS Kernel Build with V4L2 Loopback**
            - Kernel Version: 4.14.356
            - Clang: r547379+
            - LTO: Enabled
            - V4L2 Loopback: Included
            
            Build details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
